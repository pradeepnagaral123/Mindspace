  <text x="1510" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5f6368" text-anchor="end" dominant-baseline="middle">Render</text>

  <rect x="90" y="510" width="456" height="105" rx="10" fill="#ffffff" stroke="#b7e1c1" stroke-width="1.2"/>
  <text x="110" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#202124" dominant-baseline="middle">Express 5 API</text>
  <text x="110" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">REST endpoints • /api/*</text>
  <text x="110" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">JWT auth • CORS</text>

  <rect x="572" y="510" width="456" height="105" rx="10" fill="#ffffff" stroke="#b7e1c1" stroke-width="1.2"/>
  <text x="592" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#202124" dominant-baseline="middle">Socket.IO</text>
  <text x="592" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Real-time messaging</text>
  <text x="592" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Presence • read receipts</text>

  <rect x="1054" y="510" width="456" height="105" rx="10" fill="#ffffff" stroke="#b7e1c1" stroke-width="1.2"/>
  <text x="1074" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#202124" dominant-baseline="middle">Auth &amp; Services</text>
  <text x="1074" y="562" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Google OAuth • Brevo email</text>
  <text x="1074" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Groq AI • Mongoose ODM</text>

  <line x1="410" y1="645" x2="410" y2="709" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="424" y="679" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5f6368" dominant-baseline="middle">Mongoose / SRV + TLS</text>
  <line x1="1180" y1="645" x2="1180" y2="709" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1194" y="679" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5f6368" dominant-baseline="middle">HTTPS APIs</text>

  <rect x="60" y="715" width="700" height="170" rx="14" fill="#fffaf0" stroke="#f6c66f" stroke-width="1.4"/>
