<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <title>MindSpace system architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="60" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#202124" dominant-baseline="middle">MINDSPACE — SYSTEM ARCHITECTURE</text>
  <text x="60" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">React SPA → Express API → MongoDB Atlas, with real-time chat and external integrations</text>

  <rect x="650" y="125" width="300" height="58" rx="29" fill="#f1f3f4" stroke="#dadce0" stroke-width="1.4"/>
  <text x="800" y="147" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#202124" text-anchor="middle" dominant-baseline="middle">User (Browser)</text>
  <text x="800" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" text-anchor="middle" dominant-baseline="middle">Web session</text>
  <line x1="800" y1="183" x2="800" y2="219" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="812" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5f6368" dominant-baseline="middle">HTTPS</text>

  <rect x="60" y="225" width="1480" height="160" rx="14" fill="#f7faff" stroke="#c7d7fe" stroke-width="1.4"/>
  <text x="90" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a73e8" dominant-baseline="middle" letter-spacing="0.6">CLIENT / FRONTEND</text>
  <text x="1510" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5f6368" text-anchor="end" dominant-baseline="middle">Vercel</text>

  <rect x="90" y="280" width="456" height="85" rx="10" fill="#ffffff" stroke="#c7d7fe" stroke-width="1.2"/>
  <text x="110" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#202124" dominant-baseline="middle">React SPA</text>
  <text x="110" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Vite • React Router 7</text>
  <text x="110" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Tailwind CSS • Lucide icons</text>

  <rect x="572" y="280" width="456" height="85" rx="10" fill="#ffffff" stroke="#c7d7fe" stroke-width="1.2"/>
  <text x="592" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#202124" dominant-baseline="middle">Sessions &amp; Routing</text>
  <text x="592" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">JWT session in AuthContext</text>
  <text x="592" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Protected routes</text>

  <rect x="1054" y="280" width="456" height="85" rx="10" fill="#ffffff" stroke="#c7d7fe" stroke-width="1.2"/>
