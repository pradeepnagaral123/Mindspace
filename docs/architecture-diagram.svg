  <text x="90" y="792" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#202124" dominant-baseline="middle">MongoDB Atlas</text>
  <text x="90" y="824" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Mongoose 9 ODM • 10 collections</text>

  <rect x="820" y="715" width="720" height="170" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.4"/>
  <text x="850" y="745" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#7b1fa2" dominant-baseline="middle" letter-spacing="0.6">EXTERNAL SERVICES</text>

  <rect x="850" y="775" width="210" height="70" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2"/>
  <text x="870" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#202124" dominant-baseline="middle">Google OAuth</text>
  <text x="870" y="822" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Sign-in</text>

  <rect x="1075" y="775" width="210" height="70" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2"/>
  <text x="1095" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#202124" dominant-baseline="middle">Brevo</text>
  <text x="1095" y="822" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Email delivery</text>

  <rect x="1300" y="775" width="210" height="70" rx="10" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2"/>
  <text x="1320" y="800" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#202124" dominant-baseline="middle">Groq</text>
  <text x="1320" y="822" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">AI chat</text>

  <rect x="60" y="915" width="1480" height="90" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="1.4"/>
  <text x="90" y="945" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#3c4043" dominant-baseline="middle" letter-spacing="0.6">DEPLOYMENT</text>
  <text x="90" y="973" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f6368" dominant-baseline="middle">Vercel (frontend) • Render (API) • MongoDB Atlas (database) • GitHub (source)</text>
</svg>
