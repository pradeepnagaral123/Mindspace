  <text x="1074" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">REST + Bearer JWT</text>
  <text x="1074" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f6368" dominant-baseline="middle">Socket.IO client</text>

