  <text x="654" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5f6368" dominant-baseline="middle">REST / JSON + JWT</text>
  <line x1="1040" y1="385" x2="1040" y2="449" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1054" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5f6368" dominant-baseline="middle">Socket.IO (WSS)</text>

